<!DOCTYPE html>
<title>:link-to(url-pattern()) on link</title>
<link rel="author" title="Morten Stenshorne" href="mailto:mstensho@chromium.org">
<link rel="help" href="https://drafts.csswg.org/css-navigation-1/#link-to-pseudo-class">
<link rel="help" href="https://issues.chromium.org/issues/436805487">
<link rel="match" href="link-to-002-ref.html">
<p>Test passes if there is a filled green square and <strong>no red</strong>.</p>
<style>
  :link-to(url-pattern("/*/other.html")) {
    background: green;
  }
  a {
    display: block;
    width: 100px;
    height: 100px;
    background: red;
  }
</style>
<a href="other.html"></a>
